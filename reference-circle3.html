<!DOCTYPE html>
<html lang='zh-CN'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no'>
<title>三圆</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#06060f;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block;touch-action:none}
#hud{position:fixed;top:14px;left:0;right:0;text-align:center;color:rgba(180,200,255,.6);font-size:13px;letter-spacing:2px;pointer-events:none;z-index:10}
</style>
</head>
<body>
<canvas id='c'></canvas>
<div id='hud'>按住任意圆拖动</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,cx,cy,R,stars=[];
let visual=[0,0,0];
let balls=[];
const CXY=[[0,0],[0,0],[0,0]];
let GATES={};

function findGates(){
  GATES={};
  for(let c1=0;c1<3;c1++){
    for(let s1=0;s1<12;s1++){
      const ang=s1*30*Math.PI/180;
      const px=CXY[c1][0]+R*Math.cos(ang);
      const py=CXY[c1][1]+R*Math.sin(ang);
      for(let c2=0;c2<3;c2++){
        if(c2===c1)continue;
        const d=Math.hypot(px-CXY[c2][0],py-CXY[c2][1]);
        if(Math.abs(d-R)<R*0.05){
          const ang2=Math.atan2(py-CXY[c2][1],px-CXY[c2][0]);
          let s2=Math.round(ang2*180/Math.PI/30);
          s2=((s2%12)+12)%12;
          GATES[c1+'-'+s1]=[c2,s2];
          break;
        }
      }
    }
  }
}

function gatePartner(c,s){return GATES[c+'-'+s]||null;}

function resize(){
  const dpr=window.devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H/2;
  R=Math.min(W*0.30,H*0.30);
  CXY[0]=[cx-R/2, cy+Math.sqrt(3)/6*R];
  CXY[1]=[cx+R/2, cy+Math.sqrt(3)/6*R];
  CXY[2]=[cx, cy-Math.sqrt(3)/3*R];
  findGates();
  stars=[];
  for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.3,a:Math.random()*.4+.15});
}
addEventListener('resize',()=>{resize();init();});
resize();

function init(){
  visual=[0,0,0];
  balls=[];
  const posMap={};
  const colors=['b','o','p'];
  for(let c=0;c<3;c++){
    for(let s=0;s<12;s++){
      const key=c+'-'+s;
      if(posMap[key])continue;
      const ball={color:colors[c],pos:[null,null,null]};
      ball.pos[c]=s;
      balls.push(ball);
      posMap[key]=ball;
      const partner=gatePartner(c,s);
      if(partner){
        const pk=partner[0]+'-'+partner[1];
        if(!posMap[pk]){
          ball.pos[partner[0]]=partner[1];
          posMap[pk]=ball;
        }
      }
    }
  }
}
init();

function rotate(ci,dir){
  const oldPos=balls.map(b=>b.pos.slice());
  for(const b of balls){
    if(b.pos[ci]!==null)b.pos[ci]=(b.pos[ci]+dir+12)%12;
  }
  for(let k=0;k<balls.length;k++){
    const b=balls[k];
    if(b.pos[ci]===null)continue;
    const newSlot=b.pos[ci];
    const oldSlot=oldPos[k][ci];
    for(let c=0;c<3;c++){
      if(c===ci)continue;
      const oldP=(oldSlot!==null)?gatePartner(ci,oldSlot):null;
      const wasLinked=oldP&&oldP[0]===c;
      const newP=gatePartner(ci,newSlot);
      const nowLinked=newP&&newP[0]===c;
      if(nowLinked){
        b.pos[c]=newP[1];
      }else if(wasLinked&&!nowLinked){
        b.pos[c]=null;
      }
    }
  }
}

function drawRing(i,rgb){
  const [x,y]=CXY[i];
  ctx.beginPath();ctx.arc(x,y,R,0,7);
  ctx.strokeStyle='rgba('+rgb+',.45)';ctx.lineWidth=2;ctx.stroke();
  for(let k=0;k<12;k++){
    const a=(k*30)*Math.PI/180;
    ctx.beginPath();ctx.arc(x+R*Math.cos(a),y+R*Math.sin(a),2,0,7);
    ctx.fillStyle='rgba('+rgb+',.25)';ctx.fill();
  }
}

function drawBallAt(x,y,color){
  const r=R*.07;
  const col=color==='b'?'#4a9eff':color==='o'?'#ff9a3c':'#c080ff';
  const rgb=color==='b'?'74,158,255':color==='o'?'255,154,60':'192,128,255';
  const g=ctx.createRadialGradient(x,y,0,x,y,r*2.2);
  g.addColorStop(0,'rgba('+rgb+',.3)');g.addColorStop(1,'rgba('+rgb+',0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=col;ctx.fill();
  ctx.beginPath();ctx.arc(x-r*.28,y-r*.28,r*.3,0,7);ctx.fillStyle='rgba(255,255,255,.45)';ctx.fill();
}

function draw(){
  ctx.fillStyle='#06060f';ctx.fillRect(0,0,W,H);
  for(const s of stars){ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fillStyle='rgba(200,220,255,'+s.a+')';ctx.fill();}
  drawRing(0,'74,158,255');
  drawRing(1,'255,154,60');
  drawRing(2,'192,128,255');

  for(const b of balls){
    let useC=null;
    if(drag&&b.pos[drag.ci]!==null){
      useC=drag.ci;
    }else{
      for(let c=0;c<3;c++){if(b.pos[c]!==null){useC=c;break;}}
    }
    if(useC===null)continue;
    const pos=b.pos[useC];
    const a=(pos+visual[useC])*30*Math.PI/180;
    const [x0,y0]=CXY[useC];
    drawBallAt(x0+R*Math.cos(a),y0+R*Math.sin(a),b.color);
  }
}

let drag=null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left,py=e.clientY-r.top;
  let ci=-1,minD=Infinity;
  for(let c=0;c<3;c++){
    const [x0,y0]=CXY[c];
    const d=Math.abs(Math.hypot(px-x0,py-y0)-R);
    if(d<minD){minD=d;ci=c;}
  }
  if(minD>R*.7)return;
  const [x0,y0]=CXY[ci];
  drag={ci,last:Math.atan2(py-y0,px-x0)*180/Math.PI,accum:0,applied:0,id:e.pointerId};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  const r=cv.getBoundingClientRect();
  const px=e.clientX-r.left,py=e.clientY-r.top;
  const [x0,y0]=CXY[drag.ci];
  let a=Math.atan2(py-y0,px-x0)*180/Math.PI;
  let d=a-drag.last;
  while(d>180)d-=360;
  while(d<-180)d+=360;
  drag.accum+=d;drag.last=a;
  const wantSteps=Math.trunc(drag.accum/30);
  while(drag.applied<wantSteps){rotate(drag.ci,1);drag.applied++;}
  while(drag.applied>wantSteps){rotate(drag.ci,-1);drag.applied--;}
  visual[drag.ci]=(drag.accum-drag.applied*30)/30;
});
function up(e){
  if(!drag||e.pointerId!==drag.id)return;
  const remain=visual[drag.ci];
  if(remain>=0.5)rotate(drag.ci,1);
  else if(remain<=-0.5)rotate(drag.ci,-1);
  visual[drag.ci]=0;
  drag=null;
}
cv.addEventListener('pointerup',up);
cv.addEventListener('pointercancel',up);

(function loop(){draw();requestAnimationFrame(loop);})();
</script>
</body>
</html>
